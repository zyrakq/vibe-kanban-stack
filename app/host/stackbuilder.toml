[paths]
environments_path = "./environments"

[build]
skip_base_generation = true
copy_additional_files = true
env_file_patterns = [".env", "opencode.json"]
extensions = ["step-ca-trust", "repo-sync", "repo-local", "opencode"]

[build.combos]
step-ca-repo-sync = ["step-ca-trust", "repo-sync"]
step-ca-repo-local = ["step-ca-trust", "repo-local"]
step-ca-opencode-repo-sync = ["step-ca-trust", "opencode", "repo-sync"]
step-ca-opencode-repo-local = ["step-ca-trust", "opencode", "repo-local"]

[build.environments]
available = ["forwarding", "letsencrypt", "step-ca"]

[build.environments.forwarding]
extensions = []
skip_base_generation = false

[build.environments.letsencrypt]
extensions = []
skip_base_generation = false

[build.environments.step-ca]
extensions = []
combos = ["step-ca-opencode-repo-sync", "step-ca-opencode-repo-local", "step-ca-repo-sync", "step-ca-repo-local"]

