x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILE:-3}
    compress: ${LOG_COMPRESS:-true}
services:
  vibe-kanban-host:
    container_name: vibe-kanban-host
    image: ${OPENCODE_IMAGE:-localhost/vibe-kanban-host-opencode:0.1.45}
    restart: unless-stopped
    logging: *default-logging
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      PREVIEW_PROXY_PORT: ${PREVIEW_PROXY_PORT:-3001}
      VK_SHARED_API_BASE: ${VK_SHARED_API_BASE:?}
      VK_SHARED_RELAY_API_BASE: ${VK_SHARED_RELAY_API_BASE:?}
      TZ: ${TZ:-UTC}
      VIRTUAL_PORT: ${VIRTUAL_PORT:-3000}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-http}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      STEP_CA_ROOT_CA_SRC: ${STEP_CA_ROOT_CA_SRC:-/step-ca-root/root_ca.crt}
      STEP_CA_ROOT_CA_FILE: ${STEP_CA_ROOT_CA_FILE:-/etc/ssl/step-ca/root_ca.crt}
      STEP_CA_WAIT_TIMEOUT: ${STEP_CA_WAIT_TIMEOUT:-60}
      OPENCODE_CONFIG_CONTENT: ${OPENCODE_CONFIG_CONTENT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENCODE_MODEL: ${OPENCODE_MODEL:-}
    volumes:
      - vibe-kanban-host-data:/data
      - vibe-kanban-host-worktrees:/var/tmp/vibe-kanban
      - type: volume
        source: step-ca-data
        target: /step-ca-root
        read_only: true
        volume:
          subpath: certs
      - vibe-kanban-host-repos:/repos
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - vibe-kanban-host-network
      - step-ca-network
    user: root
    entrypoint: ["/usr/local/bin/step-ca-trust-entrypoint.sh"]
    build:
      context: .
      dockerfile_inline: |
        FROM ${IMAGE:-localhost/vibe-kanban-host:0.1.45}
        USER root
        RUN mkdir -p /home/appuser/.config/opencode \
            && chown -R 10001:10001 /home/appuser/.config
        COPY --chown=10001:10001 opencode.json /home/appuser/.config/opencode/opencode.json
        USER appuser
    depends_on:
      vibe-kanban-repo-sync:
        condition: service_started
  vibe-kanban-repo-sync:
    image: ${REPO_SYNC_IMAGE:-alpine/git:latest}
    container_name: vibe-kanban-repo-sync
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        URL="$${REPO_SYNC_URL}"
        BRANCH="$${REPO_SYNC_BRANCH:-main}"
        NAME="$${REPO_SYNC_DIR_NAME:-}"
        [ -n "$$NAME" ] || NAME="$$(basename "$${URL%.git}")"
        DEST="/repos/$$NAME"
        if [ -n "$${REPO_SYNC_TOKEN:-}" ]; then
          export GIT_ASKPASS=/tmp/askpass.sh
          printf '#!/bin/sh\necho "$$REPO_SYNC_TOKEN"\n' > /tmp/askpass.sh
          chmod 700 /tmp/askpass.sh
          export GIT_USERNAME="$${REPO_SYNC_USER:-x-access-token}"
          git config --global credential.username "$$GIT_USERNAME"
        fi
        if [ -n "$${REPO_SYNC_SSH_KEY:-}" ]; then
          printf '%s\n' "$$REPO_SYNC_SSH_KEY" > /tmp/id_sync
          chmod 600 /tmp/id_sync
          export GIT_SSH_COMMAND="ssh -i /tmp/id_sync -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
        fi
        git config --global --add safe.directory '*'
        while true; do
          if [ -d "$$DEST/.git" ]; then
            git -C "$$DEST" fetch --prune origin "$$BRANCH" && git -C "$$DEST" merge --ff-only "origin/$$BRANCH" \
              || echo "repo-sync: pull failed (local changes?), will retry"
          else
            git clone --branch "$$BRANCH" "$$URL" "$$DEST" || echo "repo-sync: clone failed, will retry"
          fi
          chown -R 10001:10001 "$$DEST" 2>/dev/null || true
          sleep "$${REPO_SYNC_INTERVAL:-300}"
        done
    environment:
      - REPO_SYNC_URL=${REPO_SYNC_URL:?}
      - REPO_SYNC_BRANCH=${REPO_SYNC_BRANCH:-main}
      - REPO_SYNC_DIR_NAME=${REPO_SYNC_DIR_NAME:-}
      - REPO_SYNC_TOKEN=${REPO_SYNC_TOKEN:-}
      - REPO_SYNC_USER=${REPO_SYNC_USER:-x-access-token}
      - REPO_SYNC_SSH_KEY=${REPO_SYNC_SSH_KEY:-}
      - REPO_SYNC_INTERVAL=${REPO_SYNC_INTERVAL:-300}
      - TZ=${TZ:-UTC}
    volumes:
      - vibe-kanban-host-repos:/repos
    networks:
      - vibe-kanban-host-network
networks:
  vibe-kanban-host-network:
    name: vibe-kanban-host-network
    driver: bridge
  step-ca-network:
    name: step-ca-network
    external: true
volumes:
  vibe-kanban-host-data:
    name: vibe-kanban-host-data
  vibe-kanban-host-worktrees:
    name: vibe-kanban-host-worktrees
  step-ca-data:
    external: true
  vibe-kanban-host-repos:
    name: vibe-kanban-host-repos
