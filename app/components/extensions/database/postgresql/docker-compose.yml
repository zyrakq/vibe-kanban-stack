services:
  vibe-kanban-app:
    environment:
      SERVER_DATABASE_URL: postgres://${POSTGRES_USER:-vibe-kanban}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@vibe-kanban-db:5432/${POSTGRES_DB:-vibe-kanban}
    depends_on:
      vibe-kanban-db:
        condition: service_healthy

  vibe-kanban-electric:
    depends_on:
      vibe-kanban-db:
        condition: service_healthy
