services:
  vibe-kanban-relay:
    environment:
      VIRTUAL_PORT: ${VIRTUAL_PORT:-8082}
      VIRTUAL_HOST: ${VIRTUAL_HOST}
      VIRTUAL_PROTO: ${VIRTUAL_PROTO:-http}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - letsencrypt-network

networks:
  letsencrypt-network:
    name: letsencrypt-network
    external: true
