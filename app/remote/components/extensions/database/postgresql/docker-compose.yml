services:
  vibe-kanban:
    environment:
      SERVER_DATABASE_URL: postgres://${POSTGRES_USER:-vibe-kanban}:${POSTGRES_PASSWORD:?}@vibe-kanban-db:5432/${POSTGRES_DB:-remote}
    depends_on:
      vibe-kanban-db:
        condition: service_healthy

  vibe-kanban-electric:
    depends_on:
      vibe-kanban-db:
        condition: service_healthy
