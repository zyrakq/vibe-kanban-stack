x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILE:-3}"
    compress: "${LOG_COMPRESS:-true}"

services:
  vibe-kanban:
    image: ${IMAGE:-localhost/vibe-kanban}
    container_name: vibe-kanban
    restart: unless-stopped
    volumes:
      - vibe-kanban-data:/repos
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    environment:
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      # VK_ALLOWED_ORIGINS: https://vk.example.com
    networks:
      - vibe-kanban-network

volumes:
  vibe-kanban-data:
    name: vibe-kanban-data

networks:
  vibe-kanban-network:
    name: vibe-kanban-network
